<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panda’s Crossword</title>
<style>
:root{--bg:#2a2a2c;--tile:#f5f5f3;--ink:#1d1d1f;--txt:#f2f2f2;--mut:#a0a0a6;--hi:#cfe3ff;--act:#ffd34d;--ok:#1f8f4e;--bad:#e5484d;--line:#444448;--s:min(36px,calc((100vw - 28px)/10));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
[hidden]{display:none!important}
h1{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
#welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;max-width:460px;margin:0 auto}
#welcome h1{font-size:clamp(34px,11vw,52px)}
#welcome p{color:var(--mut);line-height:1.5;margin:16px 0 24px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input.f{width:100%;height:52px;border-radius:10px;border:2px solid var(--line);background:#1f1f21;color:var(--txt);font-size:16px;padding:0 14px;margin-bottom:16px}
input.f:focus{outline:none;border-color:var(--tile)}
button.go{width:100%;height:54px;border:0;border-radius:10px;background:var(--tile);color:var(--ink);font:900 16px "Arial Black",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.small{font-size:12px;color:var(--mut);margin-top:14px;line-height:1.4}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px}
header h1{font-size:18px}
#prog{font-size:13px;color:var(--mut)}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 14px 10px;border-bottom:1px solid var(--line);min-height:62px}
#bar b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--act)}
#bar div{font-size:15px;line-height:1.35;margin-top:3px}
#gw{display:flex;justify-content:center;padding:16px 14px}
#grid{display:grid;gap:2px;grid-auto-rows:var(--s)}
.cell{position:relative;background:var(--tile);color:var(--ink);display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;user-select:none}
.cell b{font:900 calc(var(--s)*.55) "Arial Black","Helvetica Neue",Arial,sans-serif;padding-top:calc(var(--s)*.12)}
.cell i{position:absolute;top:1px;font:700 calc(var(--s)*.25)/1 Arial,sans-serif;font-style:normal;color:#555}
.cell i.A{left:2px}.cell i.D{right:2px}
.cell.in{background:var(--hi)}
.cell.act{background:var(--act)}
.cell.lock b{color:var(--ok)}
.cell.bad{background:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#win{margin:0 14px 12px;padding:14px;border-radius:10px;background:var(--ok);color:#fff;font-weight:700;line-height:1.4}
.clues{padding:4px 14px 40px;max-width:560px;margin:0 auto}
.clues h2{font:900 14px "Arial Black",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px;margin:22px 0 6px}
.clues li{list-style:none;padding:10px 8px;border-radius:8px;line-height:1.4;font-size:15px;cursor:pointer;display:flex;gap:10px}
.clues li span{font-weight:900;min-width:18px;color:var(--mut)}
.clues li.on{background:#3a3a3e}
.clues li.done{color:var(--mut);text-decoration:line-through}
.clues ul{margin:0;padding:0}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
</style></head>
<body>
<section id="welcome">
<h1>Panda’s<br>Crossword</h1>
<p>Welcome to Panda’s Crossword! Enter your name and email to get the puzzle, and join our mailing list so you know when new puzzles drop.</p>
<form id="form">
<label for="nm">Your name</label><input class="f" id="nm" required autocomplete="name">
<label for="em">Your email</label><input class="f" id="em" type="email" required autocomplete="email">
<button class="go" type="submit">Start puzzle</button>
</form>
<div class="small">No login, no password. Just solve and enjoy.</div>
</section>

<section id="play" hidden>
<header><h1>Panda’s Crossword</h1><span id="prog"></span></header>
<div id="bar"><b id="bh"></b><div id="bt"></div></div>
<div id="win" hidden></div>
<div id="gw"><div id="grid"></div></div>
<div class="clues"><h2>Across</h2><ul id="ca"></ul><h2>Down</h2><ul id="cd"></ul></div>
<input id="kb" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
</section>

<script>
const W=[
{d:'A',r:0,c:0,a:'TRANSPORT',n:1,t:'How I go take reach your side as I no get ____?'},
{d:'A',r:2,c:4,a:'WORLD',n:2,t:'Wetin people dey promise their babe: “I go give you the ____?”'},
{d:'A',r:5,c:0,a:'CARICATURE',n:3,t:'Song title for FOIA 1st album: “No use me do ____?”'},
{d:'A',r:7,c:0,a:'OWE',n:4,t:'To get gbese: “I dey ____ Palmpay?”'},
{d:'A',r:9,c:0,a:'SURPRISE',n:5,t:'When something shock you. When them do paraparan.'},
{d:'A',r:13,c:1,a:'SHINGBAI',n:6,t:'Nothing: “I no get ____.” Pidgin slang meaning nothing or anything.'},
{d:'D',r:0,c:5,a:'PHOBIA',n:1,t:'Big English word wey mean fear.'},
{d:'D',r:3,c:2,a:'THREE',n:2,t:'One and Two junior brother.'},
{d:'D',r:4,c:7,a:'BUSINESS',n:3,t:'“I just dey dey mind my ____.” Personal work wey dey pay you.'},
{d:'D',r:4,c:9,a:'CEILING',n:4,t:'The thing wey separate your roof from your room.'},
{d:'D',r:5,c:0,a:'CROSS',n:5,t:'Wetin them use kill Jesus.'},
{d:'D',r:9,c:4,a:'REWIND',n:6,t:'Fast forward am back.'}];
const $=id=>document.getElementById(id),g=$('grid'),kb=$('kb'),cells={};
let aw=0,busy=false,pname='';
g.style.gridTemplateColumns='repeat(10,var(--s))';
W.forEach((w,i)=>{w.cells=[];for(let k=0;k<w.a.length;k++){
 const r=w.r+(w.d==='D'?k:0),c=w.c+(w.d==='A'?k:0),key=r+','+c;let x=cells[key];
 if(!x){x=cells[key]={ch:'',lock:false,ws:[],el:document.createElement('div')};
  x.el.className='cell';x.el.style.gridRow=r+1;x.el.style.gridColumn=c+1;
  x.l=document.createElement('b');x.el.append(x.l);g.append(x.el);x.el.onclick=()=>pick(x);}
 x.ws.push(i);w.cells.push(x);
 if(!k){const s=document.createElement('i');s.className=w.d;s.textContent=w.d+w.n;x.el.append(s);}}
 const li=document.createElement('li');li.innerHTML='<span>'+w.n+'</span><div>'+w.t+' ('+w.a.length+')</div>';
 li.onclick=()=>{aw=i;ac=w.cells.find(c=>!c.lock)||w.cells[0];render();$('bar').scrollIntoView({behavior:'smooth'});focusIn();};
 w.li=li;$(w.d==='A'?'ca':'cd').append(li);});
let ac=W[0].cells[0];
function pick(x){if(x===ac&&x.ws.length>1)aw=x.ws.find(i=>i!==aw);else if(!x.ws.includes(aw))aw=x.ws[0];ac=x;render();focusIn();}
function focusIn(){kb.value='x';kb.focus({preventScroll:true});}
function render(){
 const w=W[aw];
 for(const k in cells){const x=cells[k];x.l.textContent=x.ch;
  x.el.className='cell'+(w.cells.includes(x)?' in':'')+(x===ac?' act':'')+(x.lock?' lock':'');}
 $('bh').textContent=w.n+' '+(w.d==='A'?'Across':'Down');
 $('bt').textContent=w.t+' ('+w.a.length+')';
 let n=0;W.forEach((v,i)=>{const d=v.cells.every(c=>c.lock);if(d)n++;v.li.className=(i===aw?'on ':'')+(d?'done':'');});
 $('prog').textContent=n+'/'+W.length+' solved';
 if(n===W.length){const m=$('win');m.hidden=false;m.textContent='You solved it'+(pname?', '+pname:'')+'! 🐼 More puzzles are coming. We’ll let you know by email.';}
}
function check(x){x.ws.forEach(i=>{const w=W[i];if(!w.cells.every(c=>c.ch))return;
 if(w.cells.map(c=>c.ch).join('')===w.a){w.cells.forEach(c=>c.lock=true);}
 else{busy=true;w.cells.forEach(c=>{if(!c.lock)c.el.classList.add('bad')});
  setTimeout(()=>{w.cells.forEach(c=>{if(!c.lock)c.ch=''});ac=w.cells.find(c=>!c.lock)||ac;aw=i;busy=false;render();},450);}});}
function put(ch){if(busy||ac.lock)return;ac.ch=ch;check(ac);
 const w=W[aw],k=w.cells.indexOf(ac),nx=w.cells.slice(k+1).find(c=>!c.lock);if(nx&&!busy)ac=nx;render();}
function back(){if(busy)return;const w=W[aw];
 if(ac.ch&&!ac.lock){ac.ch='';}else{const k=w.cells.indexOf(ac),pv=w.cells.slice(0,k).reverse().find(c=>!c.lock);if(pv){ac=pv;ac.ch='';}}
 render();}
kb.addEventListener('input',e=>{
 if((e.inputType||'').startsWith('delete'))back();
 else{const m=(e.data||kb.value.replace(/^x/,'')).toUpperCase().match(/[A-Z]/g);if(m)m.forEach(put);}
 kb.value='x';});
$('form').addEventListener('submit',e=>{e.preventDefault();
 pname=$('nm').value.trim();const email=$('em').value.trim();
 (async()=>{try{const db=window.claude&&await claude.use('db');
  if(db)await db.collection('signups').doc(Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({name:pname,email,at:new Date().toISOString()});}catch(_){}})();
 $('welcome').hidden=true;$('play').hidden=false;render();window.scrollTo(0,0);});
</script>
</body></html>
